# Serves the Vite production bundle; /api/* goes to the FastAPI backend.
server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
